name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Guard automatic news PR paths
        if: github.event_name == 'pull_request' && startsWith(github.head_ref, 'news/auto-')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mapfile -t FILES < <(gh api --paginate "repos/${GITHUB_REPOSITORY}/pulls/${{ github.event.pull_request.number }}/files" --jq '.[].filename')
          if [ "${#FILES[@]}" -eq 0 ]; then
            echo "News PR has no files"
            exit 1
          fi
          npx tsx automation/publish/check-paths.ts "${FILES[@]}"

      # The model's own tests, including the editorial guardrail that fails
      # if a field score changed without a written rationale.
      - run: npx tsx --test lev/model.test.ts lib/countdown.test.ts

      # Guards the news feed: required fields, at most one featured item,
      # unique ids/DOIs, sane dates, no placeholder sources or overclaiming
      # headlines, and one field taxonomy across code, content and model.
      - run: npx tsx --test data/news.test.ts data/articles.test.ts lib/article-seo.test.ts lib/rss.test.ts lib/json-ld.test.ts app/sitemap.test.ts

      # Phase 3.1 editorial and auto-publish guards.
      - run: npx tsx --test automation/editorial/validate.test.ts automation/editorial/generate.test.ts automation/editorial/run.test.ts automation/noise.test.ts automation/publish/publish.test.ts automation/publish/open-pr-lock.test.ts

      # Phase 3.0 ingest guards: dedup, dates, evidence conservatism,
      # source-URL matching, and the model-file write protection.
      - run: npx tsx --test automation/normalize.test.ts automation/rank.test.ts automation/validate.test.ts automation/pipeline.test.ts automation/fetch.test.ts

      # The published number must match the published assumptions. If someone
      # edits params.json without regenerating, this fails instead of shipping
      # a countdown that disagrees with its own methodology page.
      - run: npx tsx lev/run.ts --write
      - run: git diff --exit-code lev/forecast.json

      - run: npm run lint
      - run: npx tsc --noEmit
      - run: npm run build

      # Catches nav items pointing at routes nobody created, and #anchors
      # whose target id no longer exists.
      - name: Check internal links
        run: |
          npx next start -p 3000 &
          npx wait-on --timeout 60000 http://localhost:3000
          node scripts/check-links.mjs http://localhost:3000
